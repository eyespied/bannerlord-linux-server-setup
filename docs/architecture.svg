<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Bannerlord Linux server architecture</title><desc id="desc">An operator manages an Ubuntu host over SSH. SteamCMD downloads a base installation. Each Docker instance has separate game files, configuration, token and ports. Players connect through the firewall. Backups are copied off host.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#c8a45d"/></marker><style>text{font-family:Arial,sans-serif;fill:#eee4d2} .heading{font-size:24px;font-weight:bold}.label{font-size:18px}.small{font-size:16px;fill:#c5bbaa}.box{fill:#211b15;stroke:#9b7c46;stroke-width:1.5;rx:12}.line{fill:none;stroke:#c8a45d;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="880" fill="#100e0c"/>
<text x="40" y="45" class="heading">Bannerlord Linux Server Setup</text><text x="40" y="73" class="small">One Ubuntu host · isolated Docker instances · private local configuration</text>
<rect x="40" y="100" width="350" height="90" class="box"/><text x="60" y="134" class="heading">Operator PC</text><text x="60" y="165" class="label">remote.py / server.bat · SSH + SCP</text>
<rect x="810" y="100" width="350" height="90" class="box"/><text x="830" y="134" class="heading">Players / administrators</text><text x="830" y="165" class="label">UDP gameplay · TCP maps / panel</text>
<rect x="25" y="240" width="1150" height="540" rx="18" fill="#171310" stroke="#655037" stroke-width="2"/><text x="45" y="276" class="heading">Ubuntu 24.04 x86_64 VPS</text>
<path d="M215 190V303" class="line"/><text x="230" y="222" class="small">SSH access + sudo</text>
<rect x="45" y="305" width="345" height="100" class="box"/><text x="65" y="336" class="heading">Setup &amp; management</text><text x="65" y="367" class="label">bootstrap.sh → bl.py</text><text x="65" y="391" class="small">settings.json → Docker Compose</text>
<rect x="430" y="305" width="320" height="100" class="box"/><text x="450" y="336" class="heading">SteamCMD + base files</text><text x="450" y="367" class="label">Official dedicated-server download</text><text x="450" y="391" class="small">ROOT/base · copied per instance</text>
<rect x="800" y="305" width="355" height="100" class="box"/><text x="820" y="336" class="heading">Provider + host firewall</text><text x="820" y="367" class="label">Allow each instance's TCP / UDP port</text><text x="820" y="391" class="small">Configured by the operator</text><path d="M985 190V303" class="line"/>
<path d="M215 405V444H410V477" class="line"/><text x="50" y="440" class="small">Build shared compatibility image</text>
<rect x="45" y="480" width="330" height="250" class="box"/><text x="65" y="515" class="heading">Docker instance: server1</text><text x="65" y="548" class="label">Runtime: .NET / ASP.NET 6.0.36</text><text x="65" y="579" class="label">Own TCP + UDP port: 7210</text><text x="65" y="615" class="small">instances/server1/game → /game</text><text x="65" y="644" class="small">Modules + maps + server config</text><text x="65" y="679" class="small">Private token → read-only mount</text><text x="65" y="707" class="small">Independent logs and restart policy</text>
<rect x="435" y="480" width="330" height="250" class="box"/><text x="455" y="515" class="heading">Docker instance: server2</text><text x="455" y="548" class="label">Same compatibility image</text><text x="455" y="579" class="label">Own TCP + UDP port: 7220</text><text x="455" y="615" class="small">instances/server2/game → /game</text><text x="455" y="644" class="small">Separate modules, maps and config</text><text x="455" y="679" class="small">Separate private token</text><text x="455" y="707" class="small">Add more instances in settings.json</text>
<path d="M590 405V459H210V478" class="line"/><path d="M590 459V478" class="line"/>
<path d="M975 405V451H720V478" class="line"/><path d="M975 451H330V478" class="line"/>
<rect x="825" y="530" width="310" height="145" class="box"/><text x="845" y="565" class="heading">Private backups</text><text x="845" y="599" class="label">ROOT/backups · stopped instance</text><text x="845" y="627" class="small">Game files + config + token</text><text x="845" y="655" class="small">Copy to encrypted off-host storage</text><path d="M765 620H823" class="line"/>
<text x="45" y="760" class="small">ROOT defaults to /srv/bannerlord. Instance game copies use reflinks when supported.</text>
<text x="40" y="820" class="label">GitHub contains setup code and templates. Game binaries, credentials and private backups stay off GitHub.</text>
<text x="40" y="850" class="small">Steam anonymous downloads and TaleWorlds hosting tokens are separate. Custom mods require compatible clients.</text>
</svg>
