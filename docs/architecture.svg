<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Bannerlord Linux server architecture</title><desc id="desc">An operator manages an Ubuntu host over SSH. SteamCMD downloads a base installation. Each Docker instance has separate game files, configuration, token and ports. Players connect through the firewall. Backups are copied off host.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#c8a45d"/></marker><style>text{font-family:Arial,sans-serif;fill:#eee4d2} .heading{font-size:24px;font-weight:bold}.label{font-size:18px}.small{font-size:16px;fill:#c5bbaa}.box{fill:#211b15;stroke:#9b7c46;stroke-width:1.5;rx:12}.line{fill:none;stroke:#c8a45d;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="1080" fill="#100e0c"/>
<text x="40" y="45" class="heading">Bannerlord Linux Server Setup</text><text x="40" y="73" class="small">One Ubuntu host · isolated Docker instances · private local configuration</text>
<rect x="40" y="100" width="350" height="90" class="box"/><text x="60" y="134" class="heading">Operator PC</text><text x="60" y="165" class="label">remote.py / server.bat · SSH + SCP</text>
<rect x="810" y="100" width="350" height="90" class="box"/><text x="830" y="134" class="heading">Players / administrators</text><text x="830" y="165" class="label">UDP gameplay · TCP maps / panel</text>
<rect x="25" y="240" width="1150" height="700" rx="18" fill="#171310" stroke="#655037" stroke-width="2"/><text x="420" y="276" class="heading">Ubuntu 24.04 x86_64 VPS</text>
<path d="M215 190V303" class="line"/><text x="230" y="222" class="small">SSH access + sudo</text>
<rect x="45" y="305" width="345" height="100" class="box"/><text x="65" y="336" class="heading">Setup &amp; management</text><text x="65" y="367" class="label">bootstrap.sh → bl.py</text><text x="65" y="391" class="small">settings.json → Docker Compose</text>
<rect x="430" y="305" width="320" height="100" class="box"/><text x="450" y="336" class="heading">SteamCMD + base files</text><text x="450" y="367" class="label">Official dedicated-server download</text><text x="450" y="391" class="small">ROOT/base · copied per instance</text>
<rect x="800" y="305" width="355" height="100" class="box"/><text x="820" y="336" class="heading">Provider + host firewall</text><text x="820" y="367" class="label">Allow each instance's TCP / UDP port</text><text x="820" y="391" class="small">Configured by the operator</text><path d="M985 190V303" class="line"/>

<rect x="45" y="510" width="1110" height="285" rx="14" fill="#100e0c" stroke="#655037" stroke-width="2"/>
<path d="M215 405V508" class="line"/><text x="235" y="449" class="small">Compose controls</text><text x="235" y="472" class="small">Shared runtime image</text>
<path d="M590 405V508" class="line"/><text x="610" y="449" class="small">Independent copies</text><text x="610" y="472" class="small">Reflinks when available</text>
<path d="M975 405V508" class="line"/><text x="995" y="449" class="small">Per-instance</text><text x="995" y="472" class="small">TCP / UDP ports</text>
<text x="65" y="543" class="heading">Isolated dedicated-server instances</text>
<rect x="65" y="565" width="515" height="205" class="box"/><text x="85" y="600" class="heading">server1 · port 7210</text><text x="85" y="632" class="label">.NET / ASP.NET 6.0.36 compatibility runtime</text><text x="85" y="664" class="small">instances/server1/game → /game</text><text x="85" y="695" class="small">Own modules, maps and server configuration</text><text x="85" y="726" class="small">Private token mounted read-only</text><text x="85" y="753" class="small">Independent logs and restart policy</text>
<rect x="620" y="565" width="515" height="205" class="box"/><text x="640" y="600" class="heading">server2 · port 7220</text><text x="640" y="632" class="label">Same runtime image · separate game process</text><text x="640" y="664" class="small">instances/server2/game → /game</text><text x="640" y="695" class="small">Separate modules, maps and server configuration</text><text x="640" y="726" class="small">Separate private token mounted read-only</text><text x="640" y="753" class="small">Add more instances in settings.json</text>
<path d="M600 795V853" class="line"/><text x="620" y="831" class="small">Back up each stopped instance</text>
<rect x="45" y="855" width="1110" height="65" class="box"/><text x="65" y="882" class="label">Private backups · ROOT/backups</text><text x="65" y="907" class="small">Game files + configuration + token · copy to encrypted off-host storage</text>
<text x="40" y="986" class="label">GitHub contains setup code and templates. Game binaries, credentials and private backups stay off GitHub.</text>
<text x="40" y="1020" class="small">Steam anonymous downloads and TaleWorlds hosting tokens are separate. Custom mods require compatible clients.</text>
</svg>
